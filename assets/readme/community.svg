<title id="title">TokenDaily 社区用量榜与七种荣誉</title><desc id="desc">官网社区用量榜的结构示意。支持日榜和周榜、总榜及 Codex、Claude Code、WorkBuddy 分榜。金皇冠、银勋章、铜勋章为前三名标志；第 4 名起按百分位授予星耀、精英、进阶和新锐。图中昵称、数字和排名全部为合成示例。</desc>
