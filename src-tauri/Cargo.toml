[package]
name = "tokendaily"
version = "0.1.28"
description = "A local AI quota assistant"
license = "Apache-2.0"
authors = ["TokenDaily"]
edition = "2021"

[lib]
name = "tokendaily_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
macos-transparent = ["tauri/macos-private-api"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
getrandom = "0.3.4"
sha2 = "0.10"
chrono = "0.4.45"
memchr = "2"
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
pbkdf2 = "0.12"
rusqlite = { version = "0.38", features = ["bundled", "serialize"] }
zeroize = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["native-tls", "system-proxy"] }
security-framework = "=3.7.0"
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_Security", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
